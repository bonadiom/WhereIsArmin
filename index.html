<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where is Armin? Live Location Tracker</title>
  
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    header {
      background-color: #ffffff;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; font-size: 1.2rem; color: #333; }

    #status {
      font-size: 0.9rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      height: 10px; width: 10px;
      border-radius: 50%;
      background-color: #ccc;
      display: inline-block;
    }

    .connected { background-color: #28a745; }
    .error { background-color: #dc3545; }

    /* Bottom Sheet Styles */
    .sheet-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sheet-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      bottom: -100%;
      left: 0; width: 100%;
      background: #ffffff;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2001;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      transition: bottom 0.3s cubic-bezier(0, 0, 0.2, 1);
    }

    .bottom-sheet.active {
      bottom: 0;
    }

    .sheet-header {
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 16px;
      color: #333;
    }

    .sheet-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sheet-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
    }

    .apple-btn { background-color: #000000; }
    .google-btn { background-color: #4285F4; }

    .cancel-btn {
      background-color: #f1f3f4;
      color: #333;
      border: none;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Where is Armin? Live Tracking</h1>
    <div id="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connecting to JSONBin...</span>
    </div>
  </header>

  <div id="map"></div>

  <!-- Slide-up Bottom Sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-header">Get Directions</div>
    <div class="sheet-options">
      <a href="#" id="appleLink" target="_blank" rel="noopener noreferrer" class="sheet-btn apple-btn" onclick="closeSheet()">
        🍎 Apple Maps
      </a>
      <a href="#" id="googleLink" target="_blank" rel="noopener noreferrer" class="sheet-btn google-btn" onclick="closeSheet()">
        📍 Google Maps
      </a>
      <button class="sheet-btn cancel-btn" onclick="closeSheet()">Cancel</button>
    </div>
  </div>

  <!-- Leaflet.js JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const CONFIG = {
      BIN_ID: '6a8a12a3f5f4af5e2936895d', 
      MASTER_KEY: '$2a$10$T37qiDxe.gLpewvCcUX4NOcVNv08inK6vFiwJF8rxSjX5V6Aa8aPC', 
      POLL_INTERVAL_MS: 120000 
    };

    let map;
    let marker;
    const statusTextEl = document.getElementById('status-text');
    const statusDotEl = document.getElementById('status-dot');

    const potatoIcon = L.icon({
      iconUrl: 'img/potato.png',
      iconSize: [50, 50],
      iconAnchor: [25, 50],
      popupAnchor: [0, -45]
    });

    function initMap() {
      map = L.map('map').setView([0, 0], 2);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }).addTo(map);
    }

    function openDirectionsSheet(lat, lng) {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  // iOS Native App Deep Link vs Android/Web Universal Link
  const googleMapsUrl = isIOS 
    ? `comgooglemaps://?daddr=${lat},${lng}&directionsmode=driving`
    : `intent://maps.google.com/maps?daddr=${lat},${lng}#Intent;scheme=https;package=com.google.android.apps.maps;end;`;

  // Apple Maps URL (Native on iOS/macOS)
  const appleMapsUrl = `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;

  // Assign links directly to the anchors
  const googleBtn = document.getElementById('googleLink');
  const appleBtn = document.getElementById('appleLink');

  googleBtn.href = googleMapsUrl;
  appleBtn.href = appleMapsUrl;

  // Remove custom JS handlers so the browser natively processes the deep link
  googleBtn.onclick = function() { closeSheet(); };
  appleBtn.onclick = function() { closeSheet(); };

  document.getElementById('sheetBackdrop').classList.add('active');
  document.getElementById('bottomSheet').classList.add('active');
}

  document.getElementById('sheetBackdrop').classList.add('active');
  document.getElementById('bottomSheet').classList.add('active');
}

    function closeSheet() {
      document.getElementById('sheetBackdrop').classList.remove('active');
      document.getElementById('bottomSheet').classList.remove('active');
    }

    async function fetchLocation() {
      const url = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}/latest`;
      
      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'X-Master-Key': CONFIG.MASTER_KEY,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

        const data = await response.json();
        return data.record; 

      } catch (error) {
        console.error('Error fetching location:', error);
        updateStatus('Error connecting to JSONBin', 'error');
        return null;
      }
    }

    function updateMap(locationData) {
      if (!locationData || typeof locationData.lat !== 'number' || typeof locationData.lng !== 'number') {
        updateStatus('Waiting for initial GPS location record...', 'error');
        return;
      }

      const { lat, lng } = locationData;
      const newLatLng = [lat, lng];

      if (!marker) {
        marker = L.marker(newLatLng, { icon: potatoIcon }).addTo(map);
        map.setView(newLatLng, 15); 
      } else {
        marker.setLatLng(newLatLng);
      }

      const time = locationData.timestamp || new Date().toLocaleTimeString();

      const popupContent = `
        <div style="text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
          <b style="font-size: 1.05rem;">Where is Armin?</b><br>
          <span style="font-size: 0.85rem; color: #555;">Updated: ${time}</span><br>
          <small style="color: #888;">Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}</small>
          <div style="margin-top: 10px;">
            <button onclick="openDirectionsSheet(${lat}, ${lng})" 
                    style="background-color: #007aff; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">
              🧭 Get Directions
            </button>
          </div>
        </div>
      `;

      marker.bindPopup(popupContent).openPopup();
      updateStatus(`Connected. Updated: ${time}`, 'connected');
    }

    function updateStatus(text, type) {
      statusTextEl.textContent = text;
      statusDotEl.className = `status-dot ${type}`;
    }

    async function trackLocation() {
      const location = await fetchLocation();
      if (location) updateMap(location);

      setInterval(async () => {
        const updatedLocation = await fetchLocation();
        if (updatedLocation) updateMap(updatedLocation);
      }, CONFIG.POLL_INTERVAL_MS);
    }

    window.onload = () => {
      initMap();
      trackLocation();
    };
  </script>
</body>
</html>
