<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where is Armin? Live Location Tracker</title>
  
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    header {
      background-color: #ffffff;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; font-size: 1.2rem; color: #333; }

    #status {
      font-size: 0.9rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      height: 10px; width: 10px;
      border-radius: 50%;
      background-color: #ccc;
      display: inline-block;
    }

    .connected { background-color: #28a745; }
    .error { background-color: #dc3545; }
  </style>
</head>
<body>

  <header>
    <h1>Where is Armin? Live Tracking</h1>
    <div id="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connecting to JSONBin...</span>
    </div>
  </header>

  <div id="map"></div>

  <!-- Leaflet.js JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const CONFIG = {
      BIN_ID: '6a8a12a3f5f4af5e2936895d', 
      MASTER_KEY: '$2a$10$T37qiDxe.gLpewvCcUX4NOcVNv08inK6vFiwJF8rxSjX5V6Aa8aPC', 
      POLL_INTERVAL_MS: 120000 
    };

    let map;
    let marker;
    const statusTextEl = document.getElementById('status-text');
    const statusDotEl = document.getElementById('status-dot');

    // PNG Potato Icon
    const potatoIcon = L.icon({
      iconUrl: './img/Potato.png', // Relative path to your downloaded PNG image
      iconSize: [50, 50],   // Size of the icon on map
      iconAnchor: [25, 50], // Point of the icon which corresponds to marker's location (bottom center)
      popupAnchor: [0, -45] // Point from which the popup should open relative to the iconAnchor
    });

    function initMap() {
      map = L.map('map').setView([0, 0], 2);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }).addTo(map);
    }

    async function fetchLocation() {
      const url = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}/latest`;
      
      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'X-Master-Key': CONFIG.MASTER_KEY,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        return data.record; 

      } catch (error) {
        console.error('Error fetching location:', error);
        updateStatus('Error connecting to JSONBin', 'error');
        return null;
      }
    }

  function updateMap(locationData) {
  if (!locationData || typeof locationData.lat !== 'number' || typeof locationData.lng !== 'number') {
    updateStatus('Waiting for initial GPS location record...', 'error');
    return;
  }

  const { lat, lng } = locationData;
  const newLatLng = [lat, lng];

  if (!marker) {
    marker = L.marker(newLatLng, { icon: potatoIcon }).addTo(map);
    map.setView(newLatLng, 15); 
  } else {
    marker.setLatLng(newLatLng);
  }

  const time = locationData.timestamp || new Date().toLocaleTimeString();
  
  // Google Maps Directions URL using the coordinate destination
  const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

  // Popup content with styled Google Maps Directions button
  const popupContent = `
    <div style="text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
      <b style="font-size: 1.05rem;">Where is Armin?</b><br>
      <span style="font-size: 0.85rem; color: #555;">Updated: ${time}</span><br>
      <small style="color: #888;">Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}</small>
      <div style="margin-top: 10px;">
        <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" 
           style="display: inline-block; background-color: #4285F4; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 0.85rem;">
           📍 Get Directions
        </a>
      </div>
    </div>
  `;

  marker.bindPopup(popupContent).openPopup();

  updateStatus(`Connected. Updated: ${time}`, 'connected');
}

    function updateStatus(text, type) {
      statusTextEl.textContent = text;
      statusDotEl.className = `status-dot ${type}`;
    }

    async function trackLocation() {
      const location = await fetchLocation();
      if (location) {
        updateMap(location);
      }

      setInterval(async () => {
        const updatedLocation = await fetchLocation();
        if (updatedLocation) {
          updateMap(updatedLocation);
        }
      }, CONFIG.POLL_INTERVAL_MS);
    }

    window.onload = () => {
      initMap();
      trackLocation();
    };
  </script>
</body>
</html>
