<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Where is Armin?</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #f5f5f7;
        }
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }
        .status-card {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            font-size: 0.85rem;
            font-weight: 500;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            max-width: 90%;
            text-align: center;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #8e8e93;
            display: inline-block;
        }
        .status-dot.connected { background-color: #34c759; }
        .status-dot.error { background-color: #ff3b30; }
        
        .potato-icon {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="status-card">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Connecting to tracker...</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const BIN_ID = '6a8a12a3f5f4af5e2936895d';
        const MASTER_KEY = '$2a$10$T37qiDxe.gLpewvCcUX4NOcVNv08inK6vFiwJF8rxSjX5V6Aa8aPC';
        const POLL_INTERVAL = 30000; // Poll JSONBin every 30 seconds

        let map;
        let mainMarker;
        let polylineLayer = null;
        const breadcrumbGroup = L.layerGroup();

        // Custom icon for current position
        const potatoIcon = L.icon({
            iconUrl: 'potato.png',
            iconSize: [46, 46],
            iconAnchor: [23, 23],
            popupAnchor: [0, -23],
            className: 'potato-icon'
        });

        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([0, 0], 2);

            // Add Zoom control in bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // High contrast Voyager tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_3hv2_1_ded0cfddf9aef0a5008bf567', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(map);

            breadcrumbGroup.addTo(map);
        }

        function updateStatus(text, type) {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + (type || '');
        }

        function openDirectionsSheet(lat, lng) {
            const isAppleDevice = /Mac|iPhone|iPod|iPad/i.test(navigator.userAgent);
            const url = isAppleDevice 
                ? `http://maps.apple.com/?daddr=${lat},${lng}`
                : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            window.open(url, '_blank');
        }

        async function fetchLocationData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': MASTER_KEY
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                if (data && data.record) {
                    renderTrackingData(data.record);
                } else {
                    updateStatus('Invalid data format received', 'error');
                }
            } catch (err) {
                console.error('Fetch error:', err);
                updateStatus('Connection error', 'error');
            }
        }

        function renderTrackingData(record) {
            const { lat, lng, timestamp, history } = record;

            if (typeof lat !== 'number' || typeof lng !== 'number') {
                updateStatus('Waiting for valid GPS signal...', 'error');
                return;
            }

            const currentLatLng = [lat, lng];

            // 1. Process Breadcrumb History Array
            const pathCoordinates = [];
            breadcrumbGroup.clearLayers();

            if (Array.isArray(history) && history.length > 0) {
                history.forEach((point) => {
                    if (typeof point.lat === 'number' && typeof point.lng === 'number') {
                        const pt = [point.lat, point.lng];
                        pathCoordinates.push(pt);

                        // Render individual way-point dots for history
                        const dotMarker = L.circleMarker(pt, {
                            radius: 5,
                            fillColor: '#007aff',
                            color: '#ffffff',
                            weight: 1.5,
                            opacity: 0.9,
                            fillOpacity: 0.85
                        });

                        dotMarker.bindPopup(`
                            <div style="text-align: center; font-size: 0.8rem;">
                                <b>Way-point</b><br>
                                <span style="color: #666;">${point.timestamp || 'Past fix'}</span>
                            </div>
                        `);

                        breadcrumbGroup.addLayer(dotMarker);
                    }
                });
            }

            // Ensure current live coordinate is at the end of the path array
            if (pathCoordinates.length === 0 || 
               (pathCoordinates[pathCoordinates.length - 1][0] !== lat || pathCoordinates[pathCoordinates.length - 1][1] !== lng)) {
                pathCoordinates.push(currentLatLng);
            }

            // 2. Draw or Update Polyline Trail
            if (pathCoordinates.length > 1) {
                if (!polylineLayer) {
                    polylineLayer = L.polyline(pathCoordinates, {
                        color: '#007aff',
                        weight: 4,
                        opacity: 0.65,
                        dashArray: '6, 8',
                        lineJoin: 'round'
                    }).addTo(map);
                } else {
                    polylineLayer.setLatLngs(pathCoordinates);
                }
            }

            // 3. Render or Move Main Live Marker
            if (!mainMarker) {
                mainMarker = L.marker(currentLatLng, { icon: potatoIcon }).addTo(map);
                map.setView(currentLatLng, 15);
            } else {
                mainMarker.setLatLng(currentLatLng);
            }

            const popupContent = `
                <div style="text-align: center;">
                    <b style="font-size: 1.05rem;">Where is Armin?</b><br>
                    <span style="font-size: 0.85rem; color: #555;">Updated: ${timestamp || 'Just now'}</span><br>
                    <small style="color: #888;">Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}</small>
                    <div style="margin-top: 10px;">
                        <button onclick="openDirectionsSheet(${lat}, ${lng})" 
                                style="background-color: #007aff; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">
                            🧭 Get Directions
                        </button>
                    </div>
                </div>
            `;

            mainMarker.bindPopup(popupContent);
            updateStatus(`Connected. Updated: ${timestamp || 'Live'}`, 'connected');
        }

        // Initialize application
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchLocationData();
            setInterval(fetchLocationData, POLL_INTERVAL);
        });
    </script>
</body>
</html>
